# 固定 compose 專案名稱：避免與其他同樣放在 backend/ 目錄的專案混淆
name: me-planet

services:
  postgres:
    image: postgres:15
    container_name: me-planet-api-postgres
    environment:
      POSTGRES_DB: me_planet_api_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"  # 5432 常被其他本機 Postgres 佔用
    volumes:
      - me-planet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  me-planet-pgdata:
