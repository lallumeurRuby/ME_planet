[project]
name = "me-planet-api"
version = "0.1.0"
description = "me-planet-api — BDD Workshop Python E2E"
requires-python = ">=3.11"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app", "helpers"]

[tool.mypy]
python_version = "3.11"
strict = true
