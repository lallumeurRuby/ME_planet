# ── 共用 ──────────────────────────────────────────────

# 所有規格產出物的根目錄
SPECS_ROOT_DIR: specs

# 澄清紀錄目錄（所有 prompt 共用，見 shared/clarify-loop.md）
CLARIFY_DIR: ${SPECS_ROOT_DIR}/clarify

# 每回合最多提問數（Sub-question 不計入）
MAX_QUESTIONS_PER_ROUND: 10

# ── discovery 用 ────────────────────────────────────

# Activity 檔案的存放目錄
ACTIVITIES_DIR: ${SPECS_ROOT_DIR}/activities

# api.yml 的存放目錄
API_SPECS_DIR: ${SPECS_ROOT_DIR}/api

# erm.dbml 的存放目錄
ENTITY_SPECS_DIR: ${SPECS_ROOT_DIR}/entity

# ── 後端專案根目錄 ──────────────────────────────────────
BACKEND_DIR: backend

# ── python automation 共用 ─────────────────────────────

# Python 應用程式根目錄
PY_APP_DIR: ${BACKEND_DIR}/app

# ORM Models
PY_MODELS_DIR: ${PY_APP_DIR}/models

# Repository 層
PY_REPOSITORIES_DIR: ${PY_APP_DIR}/repositories

# Service 層
PY_SERVICES_DIR: ${PY_APP_DIR}/services

# API Endpoints（FastAPI routers）
PY_API_DIR: ${PY_APP_DIR}/api

# Core（config, dependencies）
PY_CORE_DIR: ${PY_APP_DIR}/core

# Pydantic Schemas
PY_SCHEMAS_DIR: ${PY_APP_DIR}/schemas

# FastAPI 主程式
PY_MAIN_FILE: ${PY_APP_DIR}/main.py

# Behave 測試 Feature 檔案目錄
PY_TEST_FEATURES_DIR: ${BACKEND_DIR}/tests/features

# Step Definitions 目錄
PY_STEPS_DIR: ${PY_TEST_FEATURES_DIR}/steps

# Behave environment.py
PY_ENV_FILE: ${PY_TEST_FEATURES_DIR}/environment.py

# Alembic 遷移目錄
ALEMBIC_VERSIONS_DIR: ${BACKEND_DIR}/alembic/versions

# Feature 規格目錄（移入後端專案後）
FEATURE_SPECS_DIR: ${PY_TEST_FEATURES_DIR}

# ── 前端專案（Next.js + MSW） ─────────────────────────
FRONTEND_DIR: frontend
SRC_DIR: ${FRONTEND_DIR}/src
TYPES_DIR: ${SRC_DIR}/lib/types
API_CLIENT_DIR: ${SRC_DIR}/lib/api
MSW_DIR: ${SRC_DIR}/mocks
HANDLERS_DIR: ${MSW_DIR}/handlers
FRONTEND_FEATURES_DIR: ${FRONTEND_DIR}/features
PAGE_OBJECTS_DIR: ${FRONTEND_DIR}/page-objects
STEPS_DIR: ${FRONTEND_DIR}/steps

# Three.js 變體（3D 宇宙前台）
tech_flavor: threejs
THREEJS_SCENES_DIR: ${SRC_DIR}/scenes
THREEJS_SHADERS_DIR: ${SRC_DIR}/shaders
THREEJS_COMPONENTS_3D_DIR: ${SRC_DIR}/components/3d
