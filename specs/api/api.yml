openapi: 3.0.0
info:
  title: ME Planet API
  version: 1.0.0
  description: |
    ME Planet 知識衛星宇宙。讀取 API 公開；寫入 API 需 Bearer JWT（有效期 24 小時）。
    成功回應直接回傳資源或陣列（無 envelope）；錯誤回應統一為 Error `{ code, message }`。
    所有欄位驗證錯誤一律回 400（不使用 422）。
    ME Planet 內容為單筆資源（/me-planet，無 id）。

servers:
  - url: http://localhost:8000/api
    description: 本機開發（FastAPI，router 掛載於 /api）

paths:
  /auth/login:
    post:
      operationId: login
      summary: 進入後台（密碼登入）
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登入成功，發放 24 小時 JWT；連續錯誤次數歸零
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: 密碼錯誤（INVALID_PASSWORD）；連續第 5 次錯誤時同時鎖定 15 分鐘
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: 鎖定中（LOGIN_LOCKED），不比對密碼
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /satellites:
    get:
      operationId: listSatellites
      summary: 列出衛星（依 created_at 舊→新）
      tags: [satellite]
      security: []
      responses:
        '200':
          description: 衛星清單；無資料時為 []
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Satellite' }
    post:
      operationId: createSatellite
      summary: 新增衛星
      tags: [satellite]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SatelliteInput' }
      responses:
        '201':
          description: 新增成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Satellite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/NameDuplicated' }

  /satellites/{satelliteId}:
    parameters:
      - $ref: '#/components/parameters/satelliteId'
    put:
      operationId: updateSatellite
      summary: 編輯衛星
      tags: [satellite]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SatelliteInput' }
      responses:
        '200':
          description: 編輯成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Satellite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NameDuplicated' }
    delete:
      operationId: deleteSatellite
      summary: 刪除衛星（連帶刪除其子衛星與段落）
      tags: [satellite]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 刪除成功 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /satellites/{satelliteId}/sub-satellites:
    parameters:
      - $ref: '#/components/parameters/satelliteId'
    get:
      operationId: listSubSatellites
      summary: 列出指定衛星的子衛星（依 created_at 舊→新）
      tags: [sub-satellite]
      security: []
      responses:
        '200':
          description: 子衛星清單；無資料時為 []
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SubSatellite' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createSubSatellite
      summary: 新增子衛星（name 在同一衛星內唯一）
      tags: [sub-satellite]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubSatelliteInput' }
      responses:
        '201':
          description: 新增成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubSatellite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NameDuplicated' }

  /sub-satellites/{subSatelliteId}:
    parameters:
      - $ref: '#/components/parameters/subSatelliteId'
    put:
      operationId: updateSubSatellite
      summary: 編輯子衛星（只改 name，不可搬移所屬衛星）
      tags: [sub-satellite]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubSatelliteInput' }
      responses:
        '200':
          description: 編輯成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubSatellite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NameDuplicated' }
    delete:
      operationId: deleteSubSatellite
      summary: 刪除子衛星（連帶刪除其段落）
      tags: [sub-satellite]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 刪除成功 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sub-satellites/{subSatelliteId}/paragraphs:
    parameters:
      - $ref: '#/components/parameters/subSatelliteId'
    get:
      operationId: listParagraphs
      summary: 列出指定子衛星的段落（依 created_at 新→舊）
      tags: [paragraph]
      security: []
      responses:
        '200':
          description: 段落清單；無資料時為 []
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Paragraph' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createParagraph
      summary: 新增段落
      tags: [paragraph]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParagraphCreateInput' }
      responses:
        '201':
          description: 新增成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Paragraph' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /paragraphs/{paragraphId}:
    parameters:
      - $ref: '#/components/parameters/paragraphId'
    put:
      operationId: updateParagraph
      summary: 編輯段落（整筆覆蓋；summary 送 null 即清空；updated_at 更新）
      tags: [paragraph]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParagraphUpdateInput' }
      responses:
        '200':
          description: 編輯成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Paragraph' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteParagraph
      summary: 刪除段落
      tags: [paragraph]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 刪除成功 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me-planet:
    get:
      operationId: getMePlanetContent
      summary: 查看 ME Planet 內容（單筆；從未設定時 content、updated_at 為 null）
      tags: [me-planet]
      security: []
      responses:
        '200':
          description: ME Planet 內容；從未設定時回 200 + null（不回 404）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MePlanetContent' }
    put:
      operationId: updateMePlanetContent
      summary: 編輯 ME Planet 內容（upsert：從未設定時建立；整份覆蓋；updated_at 更新）
      tags: [me-planet]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MePlanetContentInput' }
      responses:
        '200':
          description: 編輯成功（首次建立亦回 200）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MePlanetContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 由 POST /auth/login 取得，有效期 24 小時

  parameters:
    satelliteId:
      name: satelliteId
      in: path
      required: true
      schema: { type: integer }
    subSatelliteId:
      name: subSatelliteId
      in: path
      required: true
      schema: { type: integer }
    paragraphId:
      name: paragraphId
      in: path
      required: true
      schema: { type: integer }

  responses:
    BadRequest:
      description: 欄位驗證失敗（REQUIRED_FIELD_EMPTY / FIELD_TOO_LONG）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 未帶 JWT、JWT 無效或已過期（UNAUTHORIZED）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 目標或父層資源不存在（NOT_FOUND）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NameDuplicated:
      description: 名稱重複（NAME_DUPLICATED）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - UNAUTHORIZED
            - INVALID_PASSWORD
            - LOGIN_LOCKED
            - REQUIRED_FIELD_EMPTY
            - FIELD_TOO_LONG
            - NOT_FOUND
            - NAME_DUPLICATED
        message:
          type: string
          description: 人類可讀的中文訊息，BDD 不驗證其文字

    LoginRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: 空字串回 400 REQUIRED_FIELD_EMPTY

    LoginResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: JWT，exp = 簽發時間 + 24 小時

    Satellite:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 50 }
        created_at: { type: string, format: date-time }

    SatelliteInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 50
          description: 必填；全域唯一（改成自己現有名稱不算重複）

    SubSatellite:
      type: object
      required: [id, satellite_id, name, created_at]
      properties:
        id: { type: integer }
        satellite_id: { type: integer }
        name: { type: string, maxLength: 50 }
        created_at: { type: string, format: date-time }

    SubSatelliteInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 50
          description: 必填；同一衛星內唯一（satellite_id 由 path 決定，不可變更）

    Paragraph:
      type: object
      required: [id, sub_satellite_id, title, summary, content, created_at, updated_at]
      properties:
        id: { type: integer }
        sub_satellite_id: { type: integer }
        title: { type: string, maxLength: 100 }
        summary: { type: string, nullable: true }
        content: { type: string, description: Rich text（HTML 字串，原樣儲存） }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ParagraphCreateInput:
      type: object
      required: [title, content]
      properties:
        title: { type: string, maxLength: 100, description: 必填；不要求唯一 }
        summary: { type: string, nullable: true, description: 選填 }
        content: { type: string, description: 必填；Rich text（HTML 字串） }

    ParagraphUpdateInput:
      type: object
      required: [title, summary, content]
      description: 整筆覆蓋
      properties:
        title: { type: string, maxLength: 100 }
        summary: { type: string, nullable: true, description: 送 null 即清空 }
        content: { type: string }

    MePlanetContent:
      type: object
      required: [content, updated_at]
      properties:
        content: { type: string, nullable: true, description: Rich text（HTML 字串，原樣儲存）；從未設定或已清空時為 null }
        updated_at: { type: string, format: date-time, nullable: true, description: 從未設定時為 null }

    MePlanetContentInput:
      type: object
      description: 整份覆蓋；無標題
      properties:
        content: { type: string, nullable: true, description: 選填；""、null 或省略一律存為 null（清空） }
